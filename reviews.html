<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Reviews | Exotic Furniture Palakkad</title>

<meta name="description" content="Share your experience with Exotic Furniture Palakkad. Your Google review helps us improve our service and helps other customers choose the best furniture shop in Palakkad.">

<meta name="keywords" content="Exotic Furniture Palakkad Reviews, Best Furniture Shop in Palakkad, Furniture Reviews">

<meta name="robots" content="index, follow">

<meta name="theme-color" content="#16a34a">

<link rel="icon" type="image/jpeg" href="assets/logo.jpeg">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="logo">
    <img src="assets/logo.jpeg"
        alt="Exotic Furniture Palakkad Logo"
        loading="eager">
</div>

<div class="container">

   
    <div class="header">
        <h1>⭐⭐⭐⭐⭐</h1>
        <h2>Choose a Review</h2>

        <p>
            Select a review below and tap
            <strong>Add Your Review</strong>.
            The review will be copied and you'll be redirected to Google Reviews.
        </p>
    </div>
    <!-- Search Bar -->
    <div class="search-box">
        <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search reviews (e.g. sofa, mattress, wardrobe)...">
    </div>


    <div id="reviewList"></div>

</div>
<div id="toast" class="toast">
    ✅ Review copied! Opening Google Reviews...
</div>

<footer class="footer">
    &copy; <span id="year"></span> RASHID-V™. All Rights Reserved.
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

<script src="script.js" defer></script>

</body>
</html>
