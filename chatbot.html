</div>        <!-- =================================

        <div class="chat-input-area">


            <input
                type="text"
                id="chatInput"
                placeholder="Tell Rashi AI about your experience..."
                autocomplete="off"
            >


            <button
                type="button"
                id="sendButton"
            >
                Send
            </button>


        </div>


        <!-- =================================

    </div>


    <!-- =====================================
         CHAT JAVASCRIPT
         ===================================== -->

    <script src="chat.js"></script>


    <script>


        // =====================================
        // QUICK MESSAGE
        // =====================================

        function quickMessage(message) {

            const input =
                document.getElementById("chatInput");


            if (!input) return;


            input.value = message;

            input.focus();

        }


        // =====================================
        // CLOSE RASHI AI
        // =====================================

        function closeChatbot() {

            /*
             * chatbot.html is loaded inside
             * the Rashi AI iframe.
             *
             * Send close request to parent.
             */

            if (window.parent !== window) {

                window.parent.postMessage(
                    {
                        type: "closeRashiAI"
                    },
                    "*"
                );

            }

        }


        // =====================================
        // FOCUS INPUT
        // =====================================

        window.addEventListener(
            "message",
            function (event) {

                if (
                    event.data &&
                    event.data.type === "focusChatInput"
                ) {

                    const input =
                        document.getElementById(
                            "chatInput"
                        );


                    if (input) {

                        input.focus();

                    }

                }

            }
        );


    </script>


</body>
